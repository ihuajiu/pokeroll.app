<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stat Bar Gradient Test</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 32px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f1ea; color: #2a2a2a;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: #777; font-size: 13px; }
  .panel {
    max-width: 640px; margin: 0 auto;
    background: #fffdf8; border: 1px solid #e6e0d4; border-radius: 16px;
    padding: 24px; box-shadow: 0 10px 30px -22px rgba(0,0,0,.5);
  }
  .bar { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
  .bl { width: 44px; font-size: 12px; font-weight: 700; color: #555; }
  .bt { flex: 1; height: 14px; background: #ece7da; border-radius: 999px; overflow: hidden; }
  .bf {
    display: block; height: 100%; border-radius: 999px;
    transition: width .25s ease, background .25s ease, box-shadow .25s ease;
  }
  .bv { width: 36px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .controls { margin: 28px 0 8px; padding-top: 20px; border-top: 1px dashed #ddd; }
  .controls label { font-size: 13px; font-weight: 600; }
  .controls input[type=range] { width: 100%; margin-top: 8px; }
  .controls .val { font-variant-numeric: tabular-nums; color: #c0392b; font-weight: 700; }
  .legend { display: flex; gap: 4px; height: 16px; border-radius: 6px; overflow: hidden; margin-top: 18px; }
  .legend span { flex: 1; }
</style>
</head>
<body>
  <div class="panel">
    <h1>Stat Bar 渐变测试</h1>
    <p class="sub">宝可梦风格分属性配色　·　纯属性色，不随数值深浅变化，仅宽度表示数值</p>

    <div id="bars"></div>

    <div class="legend" id="legend"></div>
  </div>

<script>
  // 与 HeroCard.tsx 一致：分属性纯色，无明度编码
  const STAT = {
    HP:  { v: 78,  c: "#78C850" }, // 绿
    ATK: { v: 120, c: "#F08030" }, // 红
    DEF: { v: 95,  c: "#6890F0" }, // 蓝
    SPA: { v: 150, c: "#A040A0" }, // 紫
    SPD: { v: 110, c: "#98D8D8" }, // 青
    SPE: { v: 130, c: "#F8D030" }, // 黄
  };

  const barsEl = document.getElementById("bars");
  Object.entries(STAT).forEach(([lb, { v, c }]) => {
    const pct = Math.min(100, Math.max(0, (v / 200) * 100));
    const row = document.createElement("div");
    row.className = "bar";
    row.innerHTML = `
      <span class="bl" style="color:${c}">${lb}</span>
      <span class="bt"><span class="bf" style="
        width:${pct}%;
        background:${c};
        box-shadow:0 0 10px -2px ${c};
      "></span></span>
      <span class="bv">${v}</span>`;
    barsEl.appendChild(row);
  });

  // 配色图例
  const legend = document.getElementById("legend");
  Object.entries(STAT).forEach(([lb, { c }]) => {
    const s = document.createElement("span");
    s.style.background = c;
    s.title = lb;
    legend.appendChild(s);
  });
</script>
</body>
</html>
