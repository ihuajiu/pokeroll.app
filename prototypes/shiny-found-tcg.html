<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiny Found — TCG card prototype</title>
<style>
  :root {
    --holo: linear-gradient(115deg, #5eead4 0%, #818cf8 32%, #f0abfc 62%, #fde68a 100%);
    --gold: linear-gradient(100deg, #fde68a 0%, #f59e0b 45%, #fbbf24 70%, #fff7d6 100%);
    --card-bg: #14161f;
    --card-bg-2: #1b1e2b;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 16px;
    background: #f3ede2; /* 模拟站点浅色页 */
    font-family: "Sora", "Outfit", system-ui, sans-serif;
  }

  /* ================= TCG 闪卡 ================= */
  .tcg-card {
    position: relative;
    width: min(680px, 100%);
    border-radius: 26px;
    background:
      radial-gradient(120% 90% at 50% 0%, var(--card-bg-2), var(--card-bg) 60%);
    box-shadow:
      0 30px 80px -30px rgba(20, 22, 31, 0.55),
      0 0 60px -20px rgba(250, 204, 21, 0.25);
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
    transform: perspective(1100px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  }
  /* 全息渐变描边（mask 技术，复用 prototypes/home-v3） */
  .tcg-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    background: var(--holo);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.9;
  }
  /* 随鼠标流动的全息光泽 */
  .tcg-card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(
      115deg,
      transparent 20%,
      rgba(94, 234, 212, 0.14) 36%,
      rgba(129, 140, 248, 0.16) 46%,
      rgba(240, 171, 252, 0.16) 56%,
      rgba(253, 230, 138, 0.14) 66%,
      transparent 80%
    );
    background-size: 280% 280%;
    background-position: var(--gx, 50%) var(--gy, 50%);
    mix-blend-mode: screen;
    pointer-events: none;
    transition: background-position 0.12s linear;
  }

  /* ============ 卡头：SHINY 标 + 难度/概率 ============ */
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 28px 0;
  }
  .shiny-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.28em;
    background: var(--gold);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .shiny-tag .spark { color: #fbbf24; -webkit-text-fill-color: #fbbf24; font-size: 18px; letter-spacing: 0; }
  .chips { display: flex; gap: 8px; }
  .chip {
    font-size: 12px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.22);
    letter-spacing: 0.06em;
  }
  .chip.odds {
    border: none;
    color: #0c0d15;
    font-weight: 800;
    background: var(--holo);
  }

  /* ============ 舞台：聚光 + 闪图 ============ */
  .stage {
    position: relative;
    display: grid;
    place-items: center;
    padding: 28px 24px 6px;
    min-height: 380px;
  }
  .stage .halo {
    position: absolute;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(250, 204, 21, 0.30), transparent 65%);
    animation: breathe-gold 3.2s ease-in-out infinite;
  }
  .stage .ring {
    position: absolute;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    border: 1.5px dashed rgba(255, 255, 255, 0.18);
  }
  .stage img {
    position: relative;
    width: 300px;
    height: 300px;
    object-fit: contain;
    filter: drop-shadow(0 0 34px rgba(250, 204, 21, 0.55));
    animation: float 3.6s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes breathe-gold { 0%,100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }

  /* 常驻星星（错峰闪烁） */
  .star { position: absolute; color: rgba(253, 230, 138, 0.9); animation: twinkle 2.6s ease-in-out infinite; pointer-events: none; }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.8); } 50% { opacity: .95; transform: scale(1.15); } }

  /* 出货爆发（一次） */
  .burst { position: absolute; left: 50%; top: 46%; color: #fde68a; font-size: 22px; pointer-events: none;
    opacity: 0; animation: burst 0.9s cubic-bezier(.16,.8,.3,1) 0.15s both; }
  @keyframes burst {
    0% { opacity: 0; transform: translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(.4); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) rotate(var(--a)) translateY(-190px) scale(1.3); }
  }

  /* ============ 信息区 ============ */
  .info { text-align: center; padding: 4px 32px 8px; }
  .name {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: var(--gold);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .result { margin-top: 8px; font-size: 15px; color: rgba(255, 255, 255, 0.62); font-family: "Outfit", system-ui, sans-serif; }
  .result strong { color: #fde68a; font-weight: 700; }

  /* ============ 按钮 ============ */
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    padding: 20px 28px 30px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 16px;
    padding: 14px 26px;
    font-size: 15px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.95); }
  .btn-primary {
    color: #fff;
    background: #ee3b3b;
    box-shadow: 0 0 0 1px rgba(238,59,59,.3), 0 18px 40px -18px rgba(238,59,59,.9);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost {
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
  }
  .btn-ghost:hover { border-color: #fde68a; color: #fde68a; }

  /* HUD 进度（出货满槽） */
  .hud { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 28px 0; }
  .hud .n { font-size: 34px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .hud .lbl { font-size: 11px; letter-spacing: .18em; color: rgba(255,255,255,.45); font-weight: 700; }
  .bar { margin: 10px 28px 0; height: 6px; border-radius: 999px; background: rgba(255,255,255,.10); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, #f59e0b, #fde047); }

  @media (prefers-reduced-motion: reduce) {
    .stage img, .stage .halo, .star, .burst { animation: none; }
    .burst { display: none; }
  }
</style>
</head>
<body>

<div class="tcg-card" id="card">
  <!-- 卡头 -->
  <div class="card-head">
    <span class="shiny-tag"><span class="spark">✦</span> SHINY</span>
    <div class="chips">
      <span class="chip">EASY</span>
      <span class="chip odds">✦ 1 / 204 · GUARANTEED</span>
    </div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div>
      <div class="lbl">ENCOUNTERS</div>
      <div class="n">143</div>
    </div>
  </div>
  <div class="bar"><i></i></div>

  <!-- 舞台 -->
  <div class="stage">
    <div class="halo"></div>
    <div class="ring"></div>
    <img src="/pokemon/shiny-artwork/991.png" alt="Shiny Iron Treads">
    <!-- 常驻星星 -->
    <span class="star" style="left:10%;top:14%;font-size:14px;animation-delay:0s">✦</span>
    <span class="star" style="left:86%;top:18%;font-size:11px;animation-delay:.7s">✦</span>
    <span class="star" style="left:16%;top:78%;font-size:11px;animation-delay:1.2s">✦</span>
    <span class="star" style="left:82%;top:74%;font-size:16px;animation-delay:.4s">✦</span>
    <span class="star" style="left:50%;top:6%;font-size:10px;animation-delay:1.6s">✦</span>
    <!-- 出货爆发 -->
    <span class="burst" style="--a:0deg">✦</span>
    <span class="burst" style="--a:45deg;animation-delay:.22s">✦</span>
    <span class="burst" style="--a:90deg;animation-delay:.18s">✦</span>
    <span class="burst" style="--a:135deg;animation-delay:.28s">✦</span>
    <span class="burst" style="--a:180deg;animation-delay:.15s">✦</span>
    <span class="burst" style="--a:225deg;animation-delay:.25s">✦</span>
    <span class="burst" style="--a:270deg;animation-delay:.2s">✦</span>
    <span class="burst" style="--a:315deg;animation-delay:.3s">✦</span>
  </div>

  <!-- 信息 -->
  <div class="info">
    <div class="name">Shiny Iron Treads</div>
    <p class="result">Found after <strong>143 encounters</strong> — Lucky! Under odds.</p>
  </div>

  <!-- 按钮 -->
  <div class="actions">
    <button class="btn btn-primary">✨ Share your shiny</button>
    <button class="btn btn-ghost">⬇ Download card</button>
    <button class="btn btn-ghost">🎲 Start your own hunt</button>
  </div>
</div>

<script>
  // 鼠标视差：卡片轻倾斜 + 全息光泽跟随
  const card = document.getElementById('card');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;   // 0..1
      const y = (e.clientY - r.top) / r.height;
      card.style.setProperty('--ry', ((x - .5) * 7).toFixed(2) + 'deg');
      card.style.setProperty('--rx', ((.5 - y) * 7).toFixed(2) + 'deg');
      card.style.setProperty('--gx', (x * 100).toFixed(1) + '%');
      card.style.setProperty('--gy', (y * 100).toFixed(1) + '%');
    });
    card.addEventListener('pointerleave', () => {
      card.style.setProperty('--rx', '0deg');
      card.style.setProperty('--ry', '0deg');
      card.style.setProperty('--gx', '50%');
      card.style.setProperty('--gy', '50%');
    });
  }
</script>
</body>
</html>
